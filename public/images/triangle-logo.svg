<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 65" fill="none">
    <!-- Emblem: Modern Architecture & Interior Joinery Monogram -->
    <g transform="translate(6, 6)">
        <!-- Outer Triangle Contour in Brand Red -->
        <polygon points="26,2 52,50 0,50" stroke="#eb2449" stroke-width="4.5" stroke-linejoin="round" fill="none" />
        <!-- Inner Geometric Precision Core -->
        <polygon points="26,16 42,46 10,46" fill="#111317" opacity="0.9" />
        <line x1="26" y1="2" x2="26" y2="46" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
        <circle cx="26" cy="32" r="3.5" fill="#eb2449" />
    </g>
    <!-- Brand Typography: Crisp, High-Contrast Modern Aesthetic -->
    <text x="68" y="36" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="27" font-weight="900" letter-spacing="2.5" fill="#111317">TRIANGLE</text>
    <text x="69" y="53" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="5.5" fill="#eb2449">INTERIOR DESIGN</text>
    <!-- Trademark circle (R) -->
    <circle cx="282" cy="19" r="6" stroke="#888888" stroke-width="1" fill="none" />
    <text x="282" y="22" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#666666" text-anchor="middle">R</text>
</svg>
